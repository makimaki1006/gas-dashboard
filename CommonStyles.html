<!-- CommonStyles.html - 共通CSSスタイル -->
<style>
/* リセット & 基本 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif; background-color: #f5f7fa; color: #333; }

/* ボタン共通 */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-primary { background-color: #1a73e8; color: white; }
.btn-primary:hover { background-color: #1557b0; }
.btn-secondary { background-color: #f1f3f4; color: #5f6368; }
.btn-secondary:hover { background-color: #e8eaed; }

/* ローディング */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.loading-spinner {
  width: 40px; height: 40px;
  border: 4px solid #eee;
  border-top: 4px solid #1a73e8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* スケルトンローディング */
.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
  border-radius: 4px;
}
@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* スケルトン - KPIカード用 */
.skeleton-kpi {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.skeleton-kpi .skeleton-label {
  width: 60%;
  height: 14px;
}
.skeleton-kpi .skeleton-value {
  width: 80%;
  height: 28px;
}
.skeleton-kpi .skeleton-sub {
  width: 50%;
  height: 12px;
}

/* スケルトン - チャート用 */
.skeleton-chart {
  width: 100%;
  height: 280px;
  border-radius: 8px;
}

/* データロード中の状態 */
.is-loading .kpi-value,
.is-loading .chart-canvas {
  visibility: hidden;
}

/* カード共通 */
.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* テキストユーティリティ */
.text-muted { color: #5f6368; }
.text-primary { color: #1a73e8; }
.text-success { color: #34a853; }
.text-warning { color: #fbbc04; }
.text-danger { color: #ea4335; }

/* フレックスユーティリティ */
.d-flex { display: flex; }
.flex-column { flex-direction: column; }
.align-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 8px; }
.gap-2 { gap: 16px; }

/* テーブル共通スタイル（見やすさ向上） */
table {
  border-collapse: collapse;
  width: 100%;
}
table th,
table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid #e0e0e0;
}
table th {
  background: #f8f9fa;
  font-weight: 600;
  color: #333;
  position: sticky;
  top: 0;
}
/* ゼブラストライプ */
table tbody tr:nth-child(even) {
  background-color: #fafbfc;
}
/* ホバーエフェクト */
table tbody tr:hover {
  background-color: #e8f0fe;
  transition: background-color 0.15s ease;
}
/* 数値セルの右寄せ */
table td.num,
table th.num,
table td[data-type="number"],
.text-right {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
/* 増減表示 */
.positive { color: #34a853; }
.negative { color: #ea4335; }

/* カウントアップアニメーション */
@keyframes countUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-value {
  animation: countUp 0.5s ease-out forwards;
}

/* ========== UI/UXアニメーション（軽快版） ========== */

/* カード登場アニメーション（高速化） */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

/* KPIカード アニメーション（高速化） */
.kpi-card {
  animation: fadeInUp 0.2s ease-out forwards;
  opacity: 0;
}
.kpi-card:nth-child(1) { animation-delay: 0.02s; }
.kpi-card:nth-child(2) { animation-delay: 0.04s; }
.kpi-card:nth-child(3) { animation-delay: 0.06s; }
.kpi-card:nth-child(4) { animation-delay: 0.08s; }

/* チャートカード アニメーション（高速化） */
.chart-card {
  animation: fadeInScale 0.25s ease-out forwards;
  opacity: 0;
}
.chart-card:nth-child(odd) { animation-delay: 0.05s; }
.chart-card:nth-child(even) { animation-delay: 0.1s; }

/* ホバーエフェクト - カード（素早い反応） */
.kpi-card:hover,
.chart-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

/* ホバーエフェクト - ボタン（素早い反応） */
.tab-btn, .header-btn, .binning-tab, .salary-type-tab {
  transition: all 0.1s ease;
}
.tab-btn:hover, .header-btn:hover, .binning-tab:hover, .salary-type-tab:hover {
  transform: translateY(-1px);
}
.tab-btn:active, .header-btn:active {
  transform: translateY(0);
}

/* パルスアニメーション（新着/ハイライト用） */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.highlight, .kpi-card.highlight {
  animation: pulse 2s ease-in-out infinite;
}
.kpi-card.highlight:hover {
  animation: none;
}

/* ローディングドット */
@keyframes loadingDots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}
.loading-text::after {
  animation: loadingDots 1.5s infinite;
  content: '.';
}

/* グラフバー アニメーション（Chart.js用のCSS補助） */
@keyframes barGrow {
  from { transform: scaleY(0); }
  to { transform: scaleY(1); }
}
canvas {
  transition: opacity 0.3s ease;
}

/* タブ切り替え時のフェード（高速化） */
.tab-content {
  animation: fadeInUp 0.15s ease-out;
}

/* テーブル行のスライドイン（高速化） */
.analysis-table tbody tr {
  animation: slideInLeft 0.15s ease-out forwards;
  opacity: 0;
}
.analysis-table tbody tr:nth-child(1) { animation-delay: 0.01s; }
.analysis-table tbody tr:nth-child(2) { animation-delay: 0.02s; }
.analysis-table tbody tr:nth-child(3) { animation-delay: 0.03s; }
.analysis-table tbody tr:nth-child(4) { animation-delay: 0.04s; }
.analysis-table tbody tr:nth-child(5) { animation-delay: 0.05s; }
.analysis-table tbody tr:nth-child(n+6) { animation-delay: 0.06s; }

/* 統計カードのポップイン（高速化） */
.stat-card-enhanced {
  animation: fadeInScale 0.2s ease-out forwards;
  opacity: 0;
}
.stat-card-enhanced:nth-child(1) { animation-delay: 0.03s; }
.stat-card-enhanced:nth-child(2) { animation-delay: 0.06s; }
.stat-card-enhanced:nth-child(3) { animation-delay: 0.09s; }

/* スムーズスクロール */
html {
  scroll-behavior: smooth;
}

/* プログレスバー アニメーション（高速化） */
@keyframes progressFill {
  from { width: 0; }
}
.bar-fill {
  animation: progressFill 0.4s ease-out forwards;
}

/* アクセシビリティ：動きを減らす設定への対応 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* リップルエフェクト（ボタン用） */
.btn-ripple {
  position: relative;
  overflow: hidden;
}
.btn-ripple::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: rgba(255, 255, 255, 0.4);
  opacity: 0;
  border-radius: 50%;
  transform: scale(1) translate(-50%, -50%);
  transform-origin: 50% 50%;
}
.btn-ripple:active::after {
  animation: ripple 0.4s ease-out;
}
@keyframes ripple {
  0% { transform: scale(0) translate(-50%, -50%); opacity: 1; }
  100% { transform: scale(40) translate(-50%, -50%); opacity: 0; }
}

/* 印刷時はアニメーション無効化 */
@media print {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* 印刷最適化（共通） */
@media print {
  /* ページ区切り制御 */
  .page-break-before { page-break-before: always; }
  .page-break-after { page-break-after: always; }
  .no-break { page-break-inside: avoid; }

  /* セクション単位でページ区切りを避ける */
  .section, .chart-card, .kpi-grid {
    page-break-inside: avoid;
  }

  /* 大きなセクションの前で改ページ */
  .chart-card.full-width {
    page-break-before: auto;
  }

  /* テーブルヘッダーを各ページで繰り返す */
  table thead {
    display: table-header-group;
  }
  table tbody {
    display: table-row-group;
  }

  /* 印刷時のテーブル行のホバー無効化 */
  table tbody tr:hover {
    background-color: inherit;
  }

  /* 印刷時の余白調整 */
  .dashboard-container {
    padding: 0 !important;
  }

  /* 印刷時のフッター */
  .print-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    color: #666;
    padding: 5px;
    border-top: 1px solid #ddd;
  }
}
</style>
