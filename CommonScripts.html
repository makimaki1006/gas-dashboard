<!-- CommonScripts.html - 共通JavaScriptユーティリティ -->
<script>
/**
 * 共通ユーティリティ関数
 */
const Utils = {
  /**
   * 数値を日本語フォーマット（万円表示）
   */
  formatSalary: function(value) {
    if (value === null || value === undefined) return '-';
    return (value / 10000).toFixed(1) + '万円';
  },

  /**
   * パーセント表示
   */
  formatPercent: function(value) {
    if (value === null || value === undefined) return '-';
    return value.toFixed(1) + '%';
  },

  /**
   * 数値をカンマ区切り
   */
  formatNumber: function(value) {
    if (value === null || value === undefined) return '-';
    return value.toLocaleString();
  },

  /**
   * 日付フォーマット
   */
  formatDate: function(isoString) {
    if (!isoString) return '-';
    const date = new Date(isoString);
    return date.toLocaleString('ja-JP');
  },

  /**
   * ローディング表示
   */
  showLoading: function(elementId) {
    const el = document.getElementById(elementId);
    if (el) {
      el.innerHTML = '<div class="loading-overlay"><div class="loading-spinner"></div></div>';
    }
  },

  /**
   * ローディング非表示
   */
  hideLoading: function(elementId) {
    const el = document.getElementById(elementId);
    if (el) {
      const overlay = el.querySelector('.loading-overlay');
      if (overlay) overlay.remove();
    }
  },

  /**
   * エラー表示
   */
  showError: function(elementId, message) {
    const el = document.getElementById(elementId);
    if (el) {
      el.innerHTML = '<div style="color:#ea4335;padding:20px;text-align:center">' +
        '<p style="font-size:16px">エラーが発生しました</p>' +
        '<p style="font-size:12px;margin-top:8px">' + message + '</p></div>';
    }
  },

  /**
   * デバウンス
   */
  debounce: function(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  },

  /**
   * GASサーバー呼び出しラッパー
   */
  callServer: function(functionName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [functionName](...args);
    });
  }
};

/**
 * 数値カウントアップアニメーション
 */
const AnimateValue = {
  /**
   * 数値をカウントアップで表示
   * @param {HTMLElement|string} element - 対象要素またはID
   * @param {number} endValue - 目標値
   * @param {object} options - オプション
   */
  countUp: function(element, endValue, options = {}) {
    const el = typeof element === 'string' ? document.getElementById(element) : element;
    if (!el || endValue === null || endValue === undefined) return;

    const {
      duration = 800,      // アニメーション時間(ms)
      suffix = '',         // 接尾辞（例: '件', '万円', '%'）
      prefix = '',         // 接頭辞
      decimals = 0,        // 小数点以下桁数
      useComma = true,     // カンマ区切り
      startValue = 0       // 開始値
    } = options;

    const startTime = performance.now();
    const diff = endValue - startValue;

    function update(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);

      // イージング関数（ease-out）
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const currentValue = startValue + (diff * easeOut);

      let displayValue = decimals > 0
        ? currentValue.toFixed(decimals)
        : Math.round(currentValue);

      if (useComma) {
        displayValue = Number(displayValue).toLocaleString();
      }

      el.textContent = prefix + displayValue + suffix;
      el.classList.add('animate-value');

      if (progress < 1) {
        requestAnimationFrame(update);
      }
    }

    requestAnimationFrame(update);
  },

  /**
   * 給与値をカウントアップ（万円表示）
   */
  countUpSalary: function(element, value, isHourly = false) {
    if (isHourly) {
      this.countUp(element, value, { suffix: '円', useComma: true });
    } else {
      this.countUp(element, value / 10000, { suffix: '万円', decimals: 1 });
    }
  },

  /**
   * パーセントをカウントアップ
   */
  countUpPercent: function(element, value) {
    this.countUp(element, value, { suffix: '%', decimals: 1 });
  },

  /**
   * 件数をカウントアップ
   */
  countUpCount: function(element, value) {
    this.countUp(element, value, { suffix: '件', useComma: true });
  }
};

/**
 * チャート色定義
 */
const ChartColors = {
  primary: '#1a73e8',
  secondary: '#5f6368',
  success: '#34a853',
  warning: '#fbbc04',
  danger: '#ea4335',
  info: '#4285f4',
  palette: [
    '#1a73e8', '#34a853', '#fbbc04', '#ea4335', '#4285f4',
    '#9c27b0', '#00bcd4', '#ff9800', '#795548', '#607d8b'
  ],
  gradient: function(ctx, color1, color2) {
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, color1);
    gradient.addColorStop(1, color2);
    return gradient;
  }
};
</script>
